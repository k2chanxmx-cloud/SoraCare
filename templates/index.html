<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10152a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SoraCare">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>SoraCare</title>
</head>
<body>
  <main class="app-shell">
    <header>
      <div><p class="eyebrow">YOUR DAILY WEATHER CARE</p><h1>SoraCare <span>☁️</span></h1></div>
      <button id="refreshBtn" class="icon-btn" aria-label="再読み込み">↻</button>
    </header>

    <nav class="location-tabs" aria-label="地域切替">
      {% for key, loc in locations.items() %}
      <button class="location-tab {% if loop.first %}active{% endif %}" data-location="{{ key }}">{{ loc.icon }} {{ loc.name }}</button>
      {% endfor %}
    </nav>

    <section id="loading" class="loading-card">空の様子を確認しています…</section>
    <section id="error" class="error-card hidden"></section>

    <div id="content" class="hidden">
      <section class="hero-card">
        <div class="hero-top"><div><p id="locationName" class="place"></p><p id="updatedAt" class="updated"></p></div><div id="weatherIcon" class="weather-icon"></div></div>
        <div class="temperature-row"><strong id="temperature"></strong><div><span id="weatherLabel"></span><small id="feelsLike"></small></div></div>
        <div class="today-grid">
          <div><span>最高 / 最低</span><b id="highLow"></b></div><div><span>湿度</span><b id="humidity"></b></div>
          <div><span>降水確率</span><b id="rain"></b></div><div><span>風速</span><b id="wind"></b></div>
          <div><span>紫外線</span><b id="uv"></b></div><div><span>日の入</span><b id="sunset"></b></div>
        </div>
      </section>

      <section class="risk-grid">
        <article class="risk-card"><span class="risk-icon">🌀</span><div><small>気圧</small><strong id="pressure"></strong><p id="pressureStatus"></p></div></article>
        <article class="risk-card"><span class="risk-icon">🥵</span><div><small>熱中症</small><strong id="heatLevel"></strong><p id="heatAdvice"></p></div></article>
        <article class="risk-card"><span class="risk-icon">🛁</span><div><small>ヒートショック</small><strong id="heatshock"></strong><p>冬季のみ表示</p></div></article>
      </section>

      <section class="summary-card"><div class="section-title"><span>✦</span><h2>AI 今日の総括</h2></div><p id="summary"></p></section>

      <section class="hourly-section"><div class="section-title"><span>◷</span><h2>時間別推移</h2></div><div id="hourly" class="hourly-list"></div></section>

      <p id="source" class="source"></p>
    </div>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
